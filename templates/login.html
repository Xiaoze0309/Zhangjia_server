{% extends "base_center.html" %}
{% block title %}登录 - 樟嘉评级{% endblock %}

{% block content %}
<section style="padding:60px 0;">
  <div class="container-sm">
    <div class="card">
      <h2 class="card-title" style="text-align:center;">登录</h2>
      <p class="card-desc" style="text-align:center;">登录后可申请评级并查看订单</p>

      <form method="POST" action="{{ url_for('center.login') }}">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input type="text" name="username" class="form-control" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">登录</button>
      </form>

      <div style="text-align:center;margin-top:20px;">
        <a href="{{ url_for('center.register') }}" style="font-size:14px;">没有账号？立即注册</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
