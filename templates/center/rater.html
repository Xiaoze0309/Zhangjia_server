{% extends "base_center.html" %}
{% block title %}评级师后台 - 樟嘉评级中心{% endblock %}

{% block content %}
<section style="padding:48px 0;">
  <div class="container">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
        <div>
          <h2 class="card-title" style="margin-bottom:0;">评级师后台</h2>
          <p class="card-desc" style="margin-bottom:0;">
            {% if rater_dept %}{{ rater_dept.name }} · {{ rater_dept.euid_prefix or '' }}{% endif %}
          </p>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-sm btn-secondary" onclick="loadOrders('paid')">待评级</button>
          <button class="btn btn-sm btn-secondary" onclick="loadOrders('done')">已完成</button>
          <button class="btn btn-sm btn-secondary" onclick="loadOrders('all')">全部</button>
        </div>
      </div>

      <div id="orderList">
        <table class="table">
          <thead>
            <tr>
              <th>EPID</th>
              <th>币种</th>
              <th>部门</th>
              <th>联系方式</th>
              <th>实付</th>
              <th>状态</th>
              <th>提交时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="orderTbody">
            <tr><td colspan="8" style="text-align:center;color:var(--color-text-muted);">加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>

<!-- 发布评级结果弹窗 -->
<div id="publishModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;align-items:center;justify-content:center;padding:20px;">
  <div class="card" style="max-width:560px;width:100%;max-height:90vh;overflow-y:auto;">
    <h3 style="margin-bottom:20px;">发布评级结果</h3>
    <form id="publishForm">
      <input type="hidden" name="order_no" id="pubOrderNo">
      <div class="form-group">
        <label class="form-label">证书号 *</label>
        <input type="text" name="cert_no" class="form-control" placeholder="如：ZJ20240001" required>
      </div>
      <div class="form-group">
        <label class="form-label">评级结果（JSON 或文本）</label>
        <textarea name="cert_result" class="form-control" placeholder='{"grade":"XF45","details":"字口清晰，包浆自然"}' rows="5"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">邮寄单号（选填）</label>
        <input type="text" name="tracking_no" class="form-control" placeholder="如：SF1234567890">
      </div>
      <div class="form-group">
        <label class="form-label">回寄地址（选填）</label>
        <textarea name="return_address" class="form-control" placeholder="回寄地址" rows="2"></textarea>
      </div>
      <div style="display:flex;gap:12px;justify-content:flex-end;">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button type="submit" class="btn btn-primary">发布结果</button>
      </div>
    </form>
  </div>
</div>

<script>
const statusMap = {pending:'待支付',paid:'已支付',rating:'评级中',done:'已完成',rejected:'已驳回'};

async function loadOrders(status = 'paid') {
  try {
    const res = await fetch('/api/center/rater/list?status=' + status);
    const data = await res.json();
    const tbody = document.getElementById('orderTbody');
    if (!data.success || !data.data.length) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--color-text-muted);">暂无订单</td></tr>';
      return;
    }
    tbody.innerHTML = data.data.map(o => `
      <tr>
        <td style="font-size:13px;">${o.order_no}</td>
        <td>${o.coin_name}</td>
        <td>${o.department || '—'}</td>
        <td>${o.contact}</td>
        <td>¥${(o.final_price || 0).toFixed(2)}</td>
        <td><span class="badge badge-${o.status}">${statusMap[o.status] || o.status}</span></td>
        <td style="font-size:13px;">${(o.created_at || '').slice(0,16).replace('T',' ')}</td>
        <td>
          ${o.status === 'paid' ? `<button class="btn btn-sm btn-primary" onclick="openPublish('${o.order_no}')">发布结果</button>` : `<button class="btn btn-sm btn-secondary" onclick="viewDetail('${o.order_no}')">查看</button>`}
        </td>
      </tr>
    `).join('');
  } catch (err) {
    document.getElementById('orderTbody').innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--color-error);">加载失败</td></tr>';
  }
}

function openPublish(orderNo) {
  document.getElementById('pubOrderNo').value = orderNo;
  document.getElementById('publishModal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('publishModal').style.display = 'none';
}

function viewDetail(orderNo) {
  window.open('/center/query/' + orderNo, '_blank');
}

document.getElementById('publishForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const formData = new FormData(this);
  const payload = {};
  formData.forEach((v, k) => payload[k] = v);
  try {
    const res = await fetch('/api/center/rater/publish', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.success) {
      alert('评级结果已发布');
      closeModal();
      loadOrders('paid');
    } else {
      alert(data.message || '发布失败');
    }
  } catch (err) {
    alert('网络错误');
  }
});

loadOrders('paid');
</script>
{% endblock %}
