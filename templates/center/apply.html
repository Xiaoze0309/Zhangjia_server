{% extends "base_center.html" %}
{% block title %}申请评级 - 樟嘉评级中心{% endblock %}

{% block content %}
<section style="padding:48px 0;">
  <div class="container-sm">
    <div class="card">
      <h2 class="card-title">申请评级</h2>
      <p class="card-desc">请填写以下信息，我们将为您的藏品进行专业评级</p>

      <!-- 分步进度条 -->
      <div class="step-progress">
        <div class="step-item active" data-step="1">
          <div class="step-num">1</div>
          <div class="step-label">选择服务</div>
        </div>
        <div class="step-item" data-step="2">
          <div class="step-num">2</div>
          <div class="step-label">填写信息</div>
        </div>
        <div class="step-item" data-step="3">
          <div class="step-num">3</div>
          <div class="step-label">上传凭证</div>
        </div>
        <div class="step-item" data-step="4">
          <div class="step-num">4</div>
          <div class="step-label">确认提交</div>
        </div>
      </div>

      <form id="applyForm" enctype="multipart/form-data">
        <div class="form-group">
          <label class="form-label">评级部门 *</label>
          <select name="department" class="form-control" id="department" required onchange="updatePrice()">
            <option value="">请选择部门</option>
            {% for dept in departments %}
            <option value="{{ dept.slug }}">{{ dept.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">服务类型 *</label>
          <div style="display:flex;gap:12px;">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
              <input type="radio" name="service_type" value="online" checked onchange="updatePrice()"> 线上评级
            </label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
              <input type="radio" name="service_type" value="offline" onchange="updatePrice()"> 线下评级
            </label>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">盒子类型 *</label>
          <div style="display:flex;gap:12px;">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
              <input type="radio" name="box_type" value="PLA" checked onchange="updatePrice()"> PLA 盒（普通）
            </label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
              <input type="radio" name="box_type" value="JIN" onchange="updatePrice()"> JIN 盒（精装）
            </label>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">保真服务</label>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
            <input type="checkbox" name="has_guarantee" value="1" onchange="updatePrice()"> 是，需要保真认证（+¥20）
          </label>
        </div>

        <div class="form-group">
          <label class="form-label">联系手机号 *</label>
          <input type="tel" name="contact" class="form-control" placeholder="请输入手机号" required>
        </div>

        <div class="form-group">
          <label class="form-label">币种名称 *</label>
          <input type="text" name="coin_name" class="form-control" placeholder="如：道光通宝" required>
        </div>

        <div class="form-group">
          <label class="form-label">年代</label>
          <input type="text" name="coin_era" class="form-control" placeholder="如：清代">
        </div>

        <div class="form-group">
          <label class="form-label">藏品描述</label>
          <textarea name="coin_desc" class="form-control" placeholder="尺寸、重量、版别、品相描述等"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">上传币图（可多选）</label>
          <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">📷</div>
            <p>点击或拖拽上传图片（正、背、边齿图）</p>
          </div>
          <input type="file" id="fileInput" name="coin_images" multiple accept="image/*" style="display:none" onchange="previewImages(this)">
          <div class="image-preview" id="imagePreview"></div>
        </div>

        <div class="form-group">
          <label class="form-label">优惠券码（选填）</label>
          <div style="display:flex;gap:8px;">
            <input type="text" name="coupon_code" id="couponCode" class="form-control" placeholder="输入 EFID 券码">
            <button type="button" class="btn btn-sm btn-secondary" onclick="verifyCoupon()">验证</button>
          </div>
          <div id="couponResult" style="margin-top:8px;font-size:13px;"></div>
        </div>

        <div style="background:var(--color-bg);border-radius:var(--radius-md);padding:16px;margin-bottom:24px;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="color:var(--color-text-secondary);">原价</span>
            <span style="font-size:14px;text-decoration:line-through;color:var(--color-text-muted);" id="basePrice">¥--</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
            <span style="font-weight:600;">实付金额</span>
            <span style="font-size:24px;font-weight:700;color:var(--color-gold);" id="finalPrice">¥--</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">提交申请</button>
      </form>
    </div>
  </div>
</section>

<script>
function updatePrice() {
  const dept = document.getElementById('department').value;
  if (!dept) { return; }
  const serviceType = document.querySelector('input[name=service_type]:checked').value;
  const boxType = document.querySelector('input[name=box_type]:checked').value;
  const hasGuarantee = document.querySelector('input[name=has_guarantee]').checked ? 1 : 0;

  fetch(`/api/center/pricing?department=${dept}&service_type=${serviceType}&box_type=${boxType}&has_guarantee=${hasGuarantee}`)
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        document.getElementById('basePrice').textContent = `¥${data.price.toFixed(2)}`;
        // 如果有券码且是全免，显示 0
        const couponResult = document.getElementById('couponResult');
        if (couponResult.dataset.discount === 'full') {
          document.getElementById('finalPrice').textContent = '¥0.00';
        } else {
          document.getElementById('finalPrice').textContent = `¥${data.price.toFixed(2)}`;
        }
      }
    });
}

function verifyCoupon() {
  const code = document.getElementById('couponCode').value.trim();
  if (!code) { return; }

  fetch('/api/center/coupon/verify', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({coupon_code: code})
  })
    .then(r => r.json())
    .then(data => {
      const el = document.getElementById('couponResult');
      if (data.success) {
        el.style.color = 'var(--color-success)';
        el.dataset.discount = data.discount_type;
        el.textContent = '✓ ' + data.message;
        if (data.discount_type === 'full') {
          document.getElementById('finalPrice').textContent = '¥0.00';
        } else {
          const base = parseFloat(document.getElementById('basePrice').textContent.replace(/[¥]/g,'')) || 0;
          const final = Math.max(0, base - data.discount_value);
          document.getElementById('finalPrice').textContent = `¥${final.toFixed(2)}`;
        }
      } else {
        el.style.color = 'var(--color-error)';
        el.dataset.discount = '';
        el.textContent = '✗ ' + data.message;
        updatePrice();
      }
    })
    .catch(() => {
      document.getElementById('couponResult').textContent = '验证失败，请重试';
    });
}

function previewImages(input) {
  const preview = document.getElementById('imagePreview');
  preview.innerHTML = '';
  Array.from(input.files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.createElement('img');
      img.src = e.target.result;
      preview.appendChild(img);
    };
    reader.readAsDataURL(file);
  });
}

// 分步进度条：根据填写情况自动更新
function updateSteps() {
  const dept = document.getElementById('department').value;
  const contact = document.querySelector('input[name=contact]').value;
  const coinName = document.querySelector('input[name=coin_name]').value;
  const files = document.getElementById('fileInput').files.length;

  const s1 = dept ? 'done' : 'active';
  const s2 = (contact && coinName) ? 'done' : (dept ? 'active' : '');
  const s3 = files > 0 ? 'done' : ((contact && coinName) ? 'active' : '');
  const s4 = (contact && coinName && dept) ? 'active' : '';

  document.querySelectorAll('.step-item').forEach((el, i) => {
    el.classList.remove('active', 'done');
    const state = [s1, s2, s3, s4][i];
    if (state) el.classList.add(state);
  });
}

// 监听所有输入变化
document.querySelectorAll('#applyForm input, #applyForm select, #applyForm textarea').forEach(el => {
  el.addEventListener('input', updateSteps);
  el.addEventListener('change', updateSteps);
});
updateSteps();

document.getElementById('applyForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const formData = new FormData(this);
  const btn = this.querySelector('button[type=submit]');
  btn.disabled = true;
  btn.textContent = '提交中...';

  try {
    const res = await fetch('/api/center/apply', {
      method: 'POST',
      body: formData
    });
    const data = await res.json();
    if (data.success) {
      alert(`申请提交成功！\nEPID：${data.order_no}\n实付金额：¥${data.final_price.toFixed(2)}`);
      window.location.href = data.redirect;
    } else {
      alert(data.message || '提交失败');
    }
  } catch (err) {
    alert('网络错误，请重试');
  } finally {
    btn.disabled = false;
    btn.textContent = '提交申请';
  }
});
</script>
{% endblock %}
