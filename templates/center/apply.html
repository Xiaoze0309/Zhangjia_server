{% extends "base_center.html" %}
{% block title %}申请评级 - 樟嘉评级中心{% endblock %}

{% block content %}
<section style="padding:48px 0;">
  <div class="container-sm">
    <div class="card">
      <h2 class="card-title">申请评级</h2>
      <p class="card-desc">请填写以下信息，我们将为您的藏品进行专业评级</p>

      <form id="applyForm" enctype="multipart/form-data">
        <div class="form-group">
          <label class="form-label">联系手机号 *</label>
          <input type="tel" name="contact" class="form-control" placeholder="请输入手机号" required>
        </div>

        <div class="form-group">
          <label class="form-label">币种名称 *</label>
          <input type="text" name="coin_name" class="form-control" placeholder="如：道光通宝" required>
        </div>

        <div class="form-group">
          <label class="form-label">年代</label>
          <input type="text" name="coin_era" class="form-control" placeholder="如：清代">
        </div>

        <div class="form-group">
          <label class="form-label">藏品描述</label>
          <textarea name="coin_desc" class="form-control" placeholder="尺寸、重量、版别、品相描述等"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">上传币图（可多选）</label>
          <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">📷</div>
            <p>点击或拖拽上传图片（正、背、边齿图）</p>
          </div>
          <input type="file" id="fileInput" name="coin_images" multiple accept="image/*" style="display:none" onchange="previewImages(this)">
          <div class="image-preview" id="imagePreview"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">提交申请</button>
      </form>
    </div>
  </div>
</section>

<script>
function previewImages(input) {
  const preview = document.getElementById('imagePreview');
  preview.innerHTML = '';
  Array.from(input.files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.createElement('img');
      img.src = e.target.result;
      preview.appendChild(img);
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById('applyForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const formData = new FormData(this);
  const btn = this.querySelector('button[type=submit]');
  btn.disabled = true;
  btn.textContent = '提交中...';

  try {
    const res = await fetch('/api/center/apply', {
      method: 'POST',
      body: formData
    });
    const data = await res.json();
    if (data.success) {
      alert('申请提交成功！订单号：' + data.order_no);
      window.location.href = data.redirect;
    } else {
      alert(data.message || '提交失败');
    }
  } catch (err) {
    alert('网络错误，请重试');
  } finally {
    btn.disabled = false;
    btn.textContent = '提交申请';
  }
});
</script>
{% endblock %}
