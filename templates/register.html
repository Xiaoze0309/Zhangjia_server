{% extends "base_center.html" %}
{% block title %}注册 - 樟嘉评级中心{% endblock %}

{% block content %}
<section style="padding:60px 0;">
  <div class="container-sm">
    <div class="card">
      <h2 class="card-title" style="text-align:center;">注册</h2>
      <p class="card-desc" style="text-align:center;">创建账号开始评级之旅</p>

      <form method="POST" action="{{ url_for('center.register') }}">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input type="text" name="username" class="form-control" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
          <label class="form-label">邮箱</label>
          <input type="email" name="email" class="form-control" placeholder="请输入邮箱" required>
        </div>
        <div class="form-group">
          <label class="form-label">手机号</label>
          <input type="tel" name="phone" class="form-control" placeholder="请输入手机号">
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">注册</button>
      </form>

      <div style="text-align:center;margin-top:20px;">
        <a href="{{ url_for('center.login') }}" style="font-size:14px;">已有账号？去登录</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
